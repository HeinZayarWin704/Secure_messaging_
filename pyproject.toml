[project]
name = "hybridmsg"
version = "0.1.0"
description = "Secure Messaging with Hybrid Cryptography"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "HybridMsg Maintainers"}]
dependencies = [
  "cryptography==42.0.5",
  "typing-extensions==4.11.0"
]

[project.optional-dependencies]
test = [
  "pytest==8.2.1"
]

[project.scripts]
hybridmsg = "hybridmsg.app.client:main"

[build-system]
requires = ["setuptools==69.5.1"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
